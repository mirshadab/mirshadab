name: Profile data

# Refreshes the contribution snapshot and re-renders the charts in assets/generated/.
# Commits only when an output changed; the commit touches data/ and assets/ only, which
# are excluded from the push trigger below, so it cannot re-trigger itself.

on:
  schedule:
    - cron: "17 3 * * *" # daily, 03:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/profile-data.yml"

permissions:
  contents: write

concurrency:
  group: profile-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Fetch contribution calendar
        # Non-fatal: on any API problem the last good snapshot is kept and charts still build.
        continue-on-error: true
        env:
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_contributions.py --user "${{ github.repository_owner }}"

      - name: Render charts
        run: python scripts/build_charts.py

      - name: Test
        run: python -m unittest discover -s tests -v

      - name: Commit changed outputs
        run: |
          git add data assets/generated
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(profile): refresh contribution data and charts"
          git push
